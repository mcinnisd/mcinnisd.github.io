<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David McInnis</title>
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6;
    }
    main { max-width: 640px; padding: 48px 24px; }
    h1 { font-size: 2.5rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 24px; }
    a { color: var(--accent); text-decoration: none; margin-right: 20px; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm David.</h1>
    <p>Robotics and controls. This site is under construction.</p>
    <nav>
      <a href="https://github.com/mcinnisd">GitHub</a>
    </nav>
  </main>
</body>
</html>
